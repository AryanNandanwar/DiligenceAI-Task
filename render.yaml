# Durable hosted deploy (optional alternative to the Cloudflare tunnel).
# In the Render dashboard: New → Blueprint → connect this repo.
# Free web services spin down when idle; first request may take ~30–60s.
services:
  - type: web
    name: o2c-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: o2c-db
          property: connectionString
      - key: DB_SSL
        value: "true"

  - type: web
    name: o2c-mcp
    runtime: docker
    rootDir: mcp-server
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "3001"
      - key: BACKEND_URL
        fromService:
          name: o2c-backend
          type: web
          property: host

databases:
  - name: o2c-db
    plan: free
    databaseName: o2c
    user: o2c
